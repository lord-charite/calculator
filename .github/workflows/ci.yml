name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no actions/checkout)
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      - name: Show Python
        run: python3 --version

      - name: Install tools
        run: |
          python3 -m pip install -U pip
          python3 -m pip install ruff pytest mypy

      - name: Install project
        run: |
          python3 -m pip install -e .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -q